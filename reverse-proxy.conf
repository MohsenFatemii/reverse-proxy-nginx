events {
    worker_connections 1024;
}

http {
    client_max_body_size 50M;

    # Default server that returns 444 for unmatched domains
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # HTTP to HTTPS redirect for subdomain1
    server {
        listen 80;
        server_name subdomain1.mywebsite.com www.subdomain1.mywebsite.com;

        # Allow Let's Encrypt validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTP to HTTPS redirect for subdomain2
    server {
        listen 80;
        server_name subdomain2.mywebsite.com www.subdomain2.mywebsite.com;

        # Allow Let's Encrypt validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server for subdomain1
    server {
        listen 443 ssl http2;
        server_name subdomain1.mywebsite.com www.subdomain1.mywebsite.com;

        ssl_certificate /etc/letsencrypt/live/subdomain1.mywebsite.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/subdomain1.mywebsite.com/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://subdomain1_nginx:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            # Prevent trailing slash redirects to HTTP
            proxy_redirect http://$host/ https://$host/;
            proxy_redirect http:// https://;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # HTTPS server for subdomain2
    server {
        listen 443 ssl http2;
        server_name subdomain2.mywebsite.com www.subdomain2.mywebsite.com;

        ssl_certificate /etc/letsencrypt/live/subdomain2.mywebsite.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/subdomain2.mywebsite.com/privkey.pem;
        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://subdomain2_nginx:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            # Prevent trailing slash redirects to HTTP
            proxy_redirect http://$host/ https://$host/;
            proxy_redirect http:// https://;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # WebSocket specific configuration for subdomain2
        location /client-ws {
            proxy_pass http://subdomain2_nginx:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            # Prevent trailing slash redirects to HTTP
            proxy_redirect http://$host/ https://$host/;
            proxy_redirect http:// https://;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}
